<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jesse Makes Games</title>
  <script>
    // SPA redirect for GitHub Pages with custom domain (root, no subfolder)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + '/?p=' +
      l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
