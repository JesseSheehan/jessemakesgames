<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/JFavicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/JFavicon.ico" />
    <meta name="theme-color" content="#a4462d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jesse Sheehan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Add Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
      // Restore path encoded by 404.html for GitHub Pages SPA routing (custom domain, root)
      (function() {
        var query = window.location.search;
        if (query.slice(1, 3) === 'p=') {
          var path = query.slice(3).replace(/~and~/g, '&');
          var qs = '';
          var qi = path.indexOf('&q=');
          if (qi !== -1) {
            qs = '?' + path.slice(qi + 3).replace(/~and~/g, '&');
            path = path.slice(0, qi);
          }
          window.history.replaceState(null, null, '/' + path + qs + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Add Bootstrap JS and its dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
